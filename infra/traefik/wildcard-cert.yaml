# one wildcard cert for every app, set as traefik's default so ingresses need no tls section
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-k8s-ad-gavinf-com
  namespace: kube-system
spec:
  secretName: wildcard-k8s-ad-gavinf-com-tls
  dnsNames:
    - "*.k8s.ad.gavinf.com"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default               # traefik only honors the store named "default"
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: wildcard-k8s-ad-gavinf-com-tls

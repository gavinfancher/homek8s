# The README, automated. Run pixie's playbook first: it sets hostnames and
# puts every node on Tailscale, which the control plane's config needs.

- name: Prepare every node
  hosts: k8s
  become: true
  tasks:
    - name: Turn swap off now
      ansible.builtin.command: swapoff -a
      when: ansible_facts['swaptotal_mb'] > 0

    - name: Keep swap off after reboot
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Create k3s config dir
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

- name: Control plane
  hosts: cp
  become: true
  tasks:
    - name: Get Tailscale IP
      ansible.builtin.command: tailscale ip -4
      register: tailscale_ip
      changed_when: false

    - name: Write k3s config
      ansible.builtin.template:
        src: templates/cp-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
      notify: Restart k3s

    - name: Install k3s server
      ansible.builtin.script: scripts/install-k3s.sh server
      args:
        creates: /usr/local/bin/k3s

    - name: Read join token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token

    - name: Read kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig

  handlers:
    - name: Restart k3s
      ansible.builtin.systemd:
        name: k3s
        state: restarted
      when: not ansible_check_mode

- name: Workers
  hosts: workers
  become: true
  tasks:
    - name: Write k3s config
      ansible.builtin.template:
        src: templates/wn-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
      notify: Restart k3s-agent

    - name: Install k3s agent
      ansible.builtin.script: scripts/install-k3s.sh agent
      args:
        creates: /usr/local/bin/k3s

  handlers:
    - name: Restart k3s-agent
      ansible.builtin.systemd:
        name: k3s-agent
        state: restarted
      when: not ansible_check_mode

# Points at the control plane's Tailscale IP so kubectl works from anywhere,
# and renames "default" to "homek8s". The old ~/.kube/config is kept as a
# timestamped backup next to it.
- name: Kubeconfig on this machine
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cp: "{{ groups['cp'][0] }}"
    kube_dir: "{{ lookup('env', 'HOME') }}/.kube"
  tasks:
    - name: Create ~/.kube
      ansible.builtin.file:
        path: "{{ kube_dir }}"
        state: directory
        mode: "0700"

    - name: Write ~/.kube/config
      ansible.builtin.copy:
        content: "{{ hostvars[cp].kubeconfig.content | b64decode | replace('127.0.0.1', hostvars[cp].tailscale_ip.stdout) | replace(': default', ': homek8s') }}"
        dest: "{{ kube_dir }}/config"
        mode: "0600"
        backup: true

name: hello image

on:
  push:
    branches: [main]
    paths:
      - apps/hello/Dockerfile
      - apps/hello/site/**
      - .github/workflows/hello-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # lets GITHUB_TOKEN push to ghcr

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hello

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tags: latest + short commit sha, plus labels that link the package to this repo
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: apps/hello
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: nginxtest
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: nginxtest
spec:
  type: NodePort          # this line is what the patch changed
  selector:
    app: hello
  ports:
    - port: 80            # the Service's port inside the cluster
      targetPort: 80      # the container's port
      nodePort: 30303     # optional: pin it instead of getting a random one

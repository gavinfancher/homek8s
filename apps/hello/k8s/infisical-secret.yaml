# pulls everything in infisical's prod env under /hello into the hello-secrets Secret.
# the operator logs in with the machine identity in infra/infisical/helmchart.yaml.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: hello-secrets
  namespace: nginxtest
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60          # seconds between checks for changed values
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: k8s-test-7-nrf
        envSlug: prod
        secretsPath: /hello
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator-system
  managedKubeSecretReferences:
    - secretName: hello-secrets   # the normal k8s Secret the operator creates
      secretNamespace: nginxtest
      creationPolicy: Owner       # deleting this InfisicalSecret deletes the Secret too

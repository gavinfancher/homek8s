apiVersion: v1
kind: Namespace
metadata:
  name: nginxtest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: nginxtest
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: nginx
          image: ghcr.io/gavinfancher/hello:latest
          imagePullPolicy: Always   # re-pull :latest on every pod start
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: nginxtest
spec:
  type: ClusterIP
  selector:
    app: hello
  ports:
    - port: 80            # the Service's port inside the cluster
      targetPort: 80      # the container's port


---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  namespace: nginxtest
spec:
  ingressClassName: traefik
  rules:
    - host: hello.k8s.ad.gavinf.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  number: 80



